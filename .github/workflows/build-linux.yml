name: Build Linux

# 在 GitHub 托管的 ubuntu-22.04 runner 上编译 Linux 桌面端安装包（deb + AppImage）。
# 触发方式：手动（workflow_dispatch）或打 v* 标签时自动构建。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CI: "true"

jobs:
  linux:
    name: Linux (deb + appimage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖 (Tauri 2 / WebKit2GTK-4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            build-essential pkg-config libssl-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 (deb + appimage)
        run: pnpm tauri build --bundles deb appimage

      - name: 收集产物
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/deb/*.deb artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/ 2>/dev/null || true
          ls -la artifacts

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-linux
          path: artifacts/*
